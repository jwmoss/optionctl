[project]
name = "optionctl"
version = "0.0.1"
description = ""
readme = "README.md"
license-files = ["LICENSE"]
license = "Apache-2.0"

authors = [
    { name = "jwmoss" },
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "yfinance>=0.2.40",
    "click>=8.1",
    "rich>=13.0",
    "pandas>=2.0",
    "lxml>=5.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "peewee>=3.17",
]
requires-python = ">=3.11"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
doc = ["pdoc"]
test = ["pytest", "pytest-cov", "pytest-timeout", "pretend", "coverage[toml]"]
lint = [
    # NOTE: ruff is under active development, so we pin conservatively here
    # and let Dependabot periodically perform this update.
    "ruff~=0.15.0",
    "ty >=0.0.8",
    "interrogate",
]
dev = [
    {include-group = "doc"},
    {include-group = "test"},
    {include-group = "lint"},
    "prek",
]

[project.scripts]
"optionctl" = "optionctl._cli:main"

[project.urls]
Homepage = "https://github.com/jwmoss/optionctl"
Issues = "https://github.com/jwmoss/optionctl/issues"
Source = "https://github.com/jwmoss/optionctl"

[tool.coverage.run]
# don't attempt code coverage for the CLI entrypoints
omit = ["src/optionctl/_cli.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # Incompatible with D211
    "D213",  # Incompatible with D212
    "COM812",  # Can conflict with formatter
    "ISC001",  # Can conflict with formatter
]

[tool.ruff.lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 8

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings
convention = "google"

[tool.ruff.lint.pylint]
# Maximum number of branches for function or method
max-branches = 12
# Maximum number of return statements in function or method
max-returns = 6
# Maximum number of positional arguments for function or method
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
"src/optionctl/_cli.py" = [
    "T201",  # allow print in cli module
    "B008",  # allow function calls in click defaults
    "FBT001",  # click boolean flags are idiomatic
    "PLC0415",  # deferred imports for fast CLI startup
    "PLR0913",  # click options map to function args
    "ARG001",  # callback signature requires all params
]
"src/optionctl/scanner.py" = [
    "BLE001",  # yfinance raises unpredictable exceptions
    "PLR0913",  # scan functions need many filter params
]
"src/optionctl/polygon.py" = [
    "BLE001",  # httpx raises unpredictable exceptions
    "PLC0415",  # deferred imports for conditional logic
]
"src/optionctl/yfinance_source.py" = [
    "BLE001",  # yfinance raises unpredictable exceptions
]
"test/**/*.py" = [
    "ANN",   # no type annotations in tests
    "ARG001",  # fixtures used for side effects look unused
    "D",     # no docstrings in tests
    "S101",  # asserts are expected in tests
    "SLF001",  # tests need to access private members
    "PLR2004",  # allow magic values in tests
    "PLR0913",  # parametrized/mock tests often have many args
    "PLC0415",  # allow deferred imports in tests
    "PT019",  # @patch args misidentified as fixtures
]
"**/conftest.py" = ["D"]  # No docstrings in pytest config
[tool.interrogate]
# don't enforce documentation coverage for packaging, testing, the virtual
# environment, or the CLI (which is documented separately).
exclude = ["env", "test", "src/optionctl/_cli.py"]
ignore-semiprivate = true
fail-under = 100

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "--durations=10"

[tool.uv.sources]
optionctl = { workspace = true }
